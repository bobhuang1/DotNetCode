name: deploy-api

# CI/CD for the ShopApi (storefront + admin backend).
# Flow: build + test -> publish zip -> run EF migration bundle -> deploy to staging -> smoke test -> swap to production.
# Prerequisites (one-time):
#   az ad sp create-for-rbac --name "sp-unifiedshopping" --role Contributor \
#     --scopes /subscriptions/<sub>/resourceGroups/rg-shop --sdk-auth
#   Save the JSON as the AZURE_CREDENTIALS GitHub secret.
#   Also create secrets: AZURE_WEBAPP_PUBLISH_PROFILE (staging slot), SQL_CONNECTION_STRING (Key Vault reference recommended).

on:
  push:
    branches: [main]
    paths: ["UnifiedShopping/**"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-unifiedshopping-api   # your App Service name
  AZURE_RESOURCE_GROUP: rg-shop
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "UnifiedShopping/src/ShopApi/ShopApi.csproj"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore UnifiedShopping/UnifiedShopping.sln

      - name: Build
        run: dotnet build UnifiedShopping/UnifiedShopping.sln -c Release --no-restore

      - name: Test
        run: dotnet test UnifiedShopping/tests/ShopCommon.Tests/ShopCommon.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish/api

      - name: Create EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet ef migrations bundle \
            --project UnifiedShopping/src/ShopData/ShopData.csproj \
            --startup-project ${{ env.PROJECT_PATH }} \
            -o ./publish/efbundle
      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: ef-bundle
          path: ./publish/efbundle

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

      - uses: actions/download-artifact@v4
        with:
          name: ef-bundle
          path: ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run database migrations (idempotent)
        run: |
          chmod +x ./publish/efbundle
          ./publish/efbundle \
            --connection "${{ secrets.SQL_CONNECTION_STRING }}" \
            --verbose

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          package: ./publish/api

      - name: Smoke test staging
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/health) || true
            [ "$STATUS" = "200" ] && echo "Healthy" && exit 0
            echo "Attempt $i: got $STATUS"; sleep 15
          done
          echo "Staging failed smoke test"; exit 1

      - name: Swap staging -> production
        run: |
          az webapp deployment slot swap \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production
